<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peminjaman Barang Kantor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body
    class="bg-slate-900 text-slate-100 min-h-screen p-4 flex flex-col items-center"
  >
    <!-- Navigasi Tab -->
    <div class="w-full max-w-lg flex gap-2 mb-4">
      <button
        onclick="switchTab('form')"
        id="btnForm"
        class="flex-1 py-2 rounded-xl bg-blue-600 font-bold text-xs text-white shadow"
      >
        <i class="fa-solid fa-pen-to-square mr-1"></i> Form Input
      </button>
      <button
        onclick="switchTab('dashboard')"
        id="btnDash"
        class="flex-1 py-2 rounded-xl bg-slate-800 font-bold text-xs text-slate-400"
      >
        <i class="fa-solid fa-chart-pie mr-1"></i> Dashboard
      </button>
    </div>

    <!-- Container Utama -->
    <div
      class="w-full max-w-lg bg-slate-800/90 border border-slate-700/80 rounded-2xl p-5 shadow-xl"
    >
      <!-- TAB 1: FORM INPUT -->
      <div id="tabForm" class="space-y-4">
        <h2 class="text-lg font-bold text-center text-white">
          <i class="fa-solid fa-boxes-packing text-blue-400 mr-2"></i>Peminjaman
          Barang
        </h2>

        <!-- Scanner Kamera -->
        <button
          type="button"
          onclick="toggleScanner()"
          class="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-bold text-xs text-white flex items-center justify-center gap-2"
        >
          <i class="fa-solid fa-qrcode text-sm"></i>
          <span id="scanBtnText">Scan Barcode Lewat Kamera</span>
        </button>
        <div
          id="scannerArea"
          class="hidden border border-indigo-500/50 rounded-xl p-2 bg-slate-950"
        >
          <div id="reader"></div>
        </div>

        <form onsubmit="kirimData(event)" class="space-y-4">
          <!-- Dropdown Nama dengan Fitur Cari -->
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1"
              >Nama Pegawai / Peminjam</label
            >
            <input
              type="text"
              id="cariNama"
              oninput="filterNama()"
              placeholder="🔍 Ketik nama untuk mencari..."
              class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white outline-none mb-1"
            />
            <select
              id="namaPeminjam"
              required
              class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white outline-none"
            >
              <option value="" disabled selected>
                -- Memuat pegawai... --
              </option>
            </select>
          </div>

          <!-- ID Barcode -->
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1"
              >ID Barcode Barang</label
            >
            <input
              type="text"
              id="idBarang"
              required
              placeholder="Contoh: BRG-001"
              class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white uppercase outline-none"
            />
          </div>

          <!-- Pilihan Aksi -->
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1"
              >Aksi Transaksi</label
            >
            <div class="grid grid-cols-2 gap-2">
              <label class="cursor-pointer">
                <input
                  type="radio"
                  name="aksi"
                  value="Pinjam"
                  checked
                  class="peer hidden"
                />
                <div
                  class="p-2.5 rounded-xl text-center text-xs font-semibold bg-slate-900 text-slate-400 peer-checked:bg-blue-600 peer-checked:text-white"
                >
                  Pinjam
                </div>
              </label>
              <label class="cursor-pointer">
                <input
                  type="radio"
                  name="aksi"
                  value="Kembali"
                  class="peer hidden"
                />
                <div
                  class="p-2.5 rounded-xl text-center text-xs font-semibold bg-slate-900 text-slate-400 peer-checked:bg-emerald-600 peer-checked:text-white"
                >
                  Kembalikan
                </div>
              </label>
            </div>
          </div>

          <!-- Jumlah -->
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1"
              >Jumlah Unit</label
            >
            <input
              type="number"
              id="jumlahBarang"
              value="1"
              min="1"
              required
              class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white text-center font-bold outline-none"
            />
          </div>

          <button
            type="submit"
            id="btnSubmit"
            class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-bold text-xs text-white shadow"
          >
            Proses Transaksi Sekarang
          </button>
        </form>
      </div>

      <!-- TAB 2: DASHBOARD -->
      <div id="tabDashboard" class="hidden space-y-3">
        <div class="flex justify-between items-center">
          <h2 class="text-sm font-bold text-white">Status Stok Barang</h2>
          <button
            onclick="window.print()"
            class="px-3 py-1.5 bg-amber-500 rounded-lg text-xs font-bold text-white"
          >
            Cetak PDF
          </button>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs border-collapse">
            <thead>
              <tr class="bg-slate-900 text-slate-400 border-b border-slate-700">
                <th class="p-2">ID</th>
                <th class="p-2">Barang</th>
                <th class="p-2 text-center">Stok</th>
                <th class="p-2 text-center">Status</th>
              </tr>
            </thead>
            <tbody
              id="tabelBody"
              class="divide-y divide-slate-700 text-slate-300"
            >
              <tr>
                <td colspan="4" class="p-4 text-center">Memuat data...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      const SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbxZM3xo4RAZQuoOHcuap1-k1XkmRlOi5G2mHQkqka8FRSAXqQGVa2geRgmCEyEzNzBa0w/exec";
      let listPegawai = [];
      let html5QrCode = null;

      window.onload = function () {
        // Tangkap ID Barcode dari URL jika ada (?id=BRG-001)
        const idParam = new URLSearchParams(window.location.search).get("id");
        if (idParam)
          document.getElementById("idBarang").value = idParam.toUpperCase();

        // Muat daftar pegawai
        fetch(SCRIPT_URL + "?action=getPegawai")
          .then((res) => res.json())
          .then((data) => {
            listPegawai = data;
            renderNamaOptions(data);
          });
      };

      // Render Opsi Dropdown Nama
      function renderNamaOptions(data) {
        const select = document.getElementById("namaPeminjam");
        select.innerHTML =
          '<option value="" disabled selected>-- Pilih Nama Anda --</option>';
        data.forEach((nama) => {
          select.innerHTML += `<option value="${nama}">${nama}</option>`;
        });
        const saved = localStorage.getItem("peminjam_nama");
        if (saved && data.includes(saved)) select.value = saved;
      }

      // Fitur Pencarian Nama Cepat
      function filterNama() {
        const q = document.getElementById("cariNama").value.toLowerCase();
        const filtered = listPegawai.filter((n) => n.toLowerCase().includes(q));
        renderNamaOptions(filtered);
      }

      // Tab Navigation
      function switchTab(tab) {
        if (tab === "form") {
          document.getElementById("tabForm").classList.remove("hidden");
          document.getElementById("tabDashboard").classList.add("hidden");
          document.getElementById("btnForm").className =
            "flex-1 py-2 rounded-xl bg-blue-600 font-bold text-xs text-white shadow";
          document.getElementById("btnDash").className =
            "flex-1 py-2 rounded-xl bg-slate-800 font-bold text-xs text-slate-400";
        } else {
          document.getElementById("tabForm").classList.add("hidden");
          document.getElementById("tabDashboard").classList.remove("hidden");
          document.getElementById("btnDash").className =
            "flex-1 py-2 rounded-xl bg-blue-600 font-bold text-xs text-white shadow";
          document.getElementById("btnForm").className =
            "flex-1 py-2 rounded-xl bg-slate-800 font-bold text-xs text-slate-400";
          loadDashboard();
        }
      }

      // Load Dashboard
      function loadDashboard() {
        fetch(SCRIPT_URL + "?action=getBarang")
          .then((res) => res.json())
          .then((data) => {
            const tbody = document.getElementById("tabelBody");
            tbody.innerHTML = "";
            data.forEach((i) => {
              tbody.innerHTML += `<tr>
                            <td class="p-2 font-bold text-blue-400">${i.id}</td>
                            <td class="p-2">${i.nama}</td>
                            <td class="p-2 text-center font-bold">${i.tersedia}/${i.total}</td>
                            <td class="p-2 text-center"><span class="px-2 py-0.5 rounded text-[10px] font-bold ${i.status === "Tersedia" ? "bg-emerald-500/20 text-emerald-400" : "bg-rose-500/20 text-rose-400"}">${i.status}</span></td>
                        </tr>`;
            });
          });
      }

      // Camera Scanner Toggle
      function toggleScanner() {
        const area = document.getElementById("scannerArea");
        if (area.classList.contains("hidden")) {
          area.classList.remove("hidden");
          if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
          html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: 200 },
            (text) => {
              document.getElementById("idBarang").value = text.toUpperCase();
              html5QrCode.stop().then(() => area.classList.add("hidden"));
            },
          );
        } else {
          html5QrCode.stop().then(() => area.classList.add("hidden"));
        }
      }

      // Kirim Data
      function kirimData(e) {
        e.preventDefault();
        const btn = document.getElementById("btnSubmit");
        const nama = document.getElementById("namaPeminjam").value;

        if (!nama) return alert("Pilih nama terlebih dahulu!");

        localStorage.setItem("peminjam_nama", nama);
        btn.innerText = "Memproses...";
        btn.disabled = true;

        const payload = {
          nama_peminjam: nama,
          id_barang: document.getElementById("idBarang").value.toUpperCase(),
          aksi: document.querySelector('input[name="aksi"]:checked').value,
          jumlah: document.getElementById("jumlahBarang").value,
        };

        fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        }).then(() => {
          alert("Berhasil memproses transaksi!");
          btn.innerText = "Proses Transaksi Sekarang";
          btn.disabled = false;
          document.getElementById("idBarang").value = "";
        });
      }
    </script>
  </body>
</html>
